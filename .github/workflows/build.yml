name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: Publish GitHub Release (app downloads this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "$(git log -1 --pretty=%s)" \
            --latest
